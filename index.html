
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOOPLY - Share Your Vibe</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial,sans-serif}
header{height:65px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #252525;position:sticky;top:0;background:#090909;z-index:5}
.logo{font-size:26px;font-weight:900;color:#ff3b78;letter-spacing:1px}
header button,.nav button{background:none;border:0;color:white;font-size:20px;cursor:pointer}
.tabs{display:flex;justify-content:center;gap:30px;padding:16px;border-bottom:1px solid #252525}
.tabs span{color:#888;cursor:pointer}
.tabs .active{color:white;border-bottom:3px solid #ff3b78;padding-bottom:8px}
.feed{max-width:480px;margin:auto;padding:15px}
.video{height:490px;border-radius:18px;margin-bottom:20px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(145deg,#31105d,#d62e72,#ff9b55)}
.video:nth-child(2){background:linear-gradient(145deg,#063b50,#087d91,#42d6b0)}
.video:nth-child(3){background:linear-gradient(145deg,#35114b,#8b247c,#e65b91)}
.art{font-size:75px}
.caption{position:absolute;bottom:18px;left:16px;text-align:left;right:75px;text-shadow:0 2px 5px #000}
.caption h3{margin:0 0 8px}
.caption p{font-size:14px}
.actions{position:absolute;right:13px;bottom:30px;display:flex;flex-direction:column;gap:22px}
.actions button{background:#1119;border:0;color:white;font-size:25px;cursor:pointer}
.actions small{display:block;font-size:11px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #333;display:flex;justify-content:space-around;padding:13px;z-index:5}
.nav button{font-size:13px}
.nav b{display:block;font-size:21px;margin-bottom:4px}
footer{text-align:center;color:#777;padding:15px 0 85px;font-size:12px}
</style>
</head>
<body>

<header>
 <div class="logo">LOOPLY</div>
 <button onclick="alert('Search is coming soon!')">⌕</button>
 <button onclick="alert('Welcome to LOOPLY!')">♙</button>
</header>

<div class="tabs">
 <span>Following</span>
 <span class="active">For You</span>
 <span>Trending</span>
</div>

<main class="feed">

 <section class="video">
  <div class="art">🌈✨</div>
  <div class="caption">
   <h3>@sana_official</h3>
   <p>Welcome to LOOPLY! Share your vibe 💖</p>
   <p>♪ Original sound</p>
  </div>
  <div class="actions">
   <button onclick="like(this)">🤍<small>0</small></button>
   <button onclick="comment()">💬<small>Comment</small></button>
   <button onclick="share()">↗<small>Share</small></button>
  </div>
 </section>

 <section class="video">
  <div class="art">🌊🏝️</div>
  <div class="caption">
   <h3>@cool_creator</h3>
   <p>Enjoy the beautiful vibes! 🌊</p>
   <p>♪ Summer vibes</p>
  </div>
  <div class="actions">
   <button onclick="like(this)">🤍<small>0</small></button>
   <button onclick="comment()">💬<small>Comment</small></button>
   <button onclick="share()">↗<small>Share</small></button>
  </div>
 </section>

 <section class="video">
  <div class="art">🎧🎵</div>
  <div class="caption">
   <h3>@music_world</h3>
   <p>Music makes everything better 🎶</p>
   <p>♪ Music time</p>
  </div>
  <div class="actions">
   <button onclick="like(this)">🤍<small>0</small></button>
   <button onclick="comment()">💬<small>Comment</small></button>
   <button onclick="share()">↗<small>Share</small></button>
  </div>
 </section>

</main>

<footer>LOOPLY © 2026 · Created by Sana</footer>

<nav class="nav">
 <button onclick="home()"><b>⌂</b>Home</button>
 <button onclick="alert('Video upload coming soon!')"><b>＋</b>Create</button>
 <button onclick="alert('Notifications coming soon!')"><b>♡</b>Inbox</button>
 <button onclick="alert('Profile coming soon!')"><b>♙</b>Profile</button>
</nav>

<script>
function like(btn){
 let count=btn.querySelector("small");
 let liked=btn.dataset.liked==="yes";
 btn.dataset.liked=liked?"no":"yes";
 btn.firstChild.textContent=liked?"🤍":"❤️";
 count.textContent=Number(count.textContent)+(liked?-1:1);
}
function comment(){
 let text=prompt("Write your comment:");
 if(text) alert("Comment preview: "+text);
}
function share(){
 if(navigator.share){
  navigator.share({title:"LOOPLY",text:"Check out LOOPLY!"});
 }else{
  alert("Share LOOPLY with your friends!");
 }
}
function home(){window.scrollTo({top:0,behavior:"smooth"})}
</script>
</body>
</html>
