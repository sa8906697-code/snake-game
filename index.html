<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Snake Game</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;
  justify-content:center;background:linear-gradient(135deg,#090b24,#18234b,#30104b);
  color:white;font-family:Arial;padding:15px
}
.game{
  width:100%;max-width:420px;text-align:center;
  background:#11152dcc;padding:20px;border:1px solid #654bff;
  border-radius:24px;box-shadow:0 0 35px #684aff55
}
h1{color:#55f7d4;text-shadow:0 0 15px #55f7d4}
.score{font-size:21px;color:#ffdc69;margin:15px}
canvas{width:100%;max-width:360px;background:#080d1c;
border:2px solid #55f7d4;border-radius:12px}
button{
  border:0;border-radius:12px;padding:12px 18px;margin:5px;
  background:linear-gradient(90deg,#00d9b5,#655cff);
  color:white;font-size:17px;font-weight:bold;cursor:pointer
}
.controls{display:grid;grid-template-columns:repeat(3,60px);
justify-content:center;gap:5px;margin-top:12px}
.controls button{margin:0}
.hint{color:#b9c5e8;font-size:13px}
</style>
</head>
<body>
<div class="game">
<h1>🐍 NEON SNAKE</h1>
<div class="score">Score: <span id="score">0</span></div>
<canvas id="board" width="360" height="360"></canvas>
<p><button onclick="startGame()">▶ Restart Game</button></p>
<div class="controls">
<span></span><button onclick="change(0,-1)">⬆️</button><span></span>
<button onclick="change(-1,0)">⬅️</button>
<button onclick="change(0,1)">⬇️</button>
<button onclick="change(1,0)">➡️</button>
</div>
<p class="hint">Use arrow keys or WASD to play!</p>
<p id="message"></p>
</div>
<script>
const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");
const size=18,cells=20;
let snake,food,dx,dy,score,timer,running;

function randomFood(){
 let p;
 do{
  p={x:Math.floor(Math.random()*cells),y:Math.floor(Math.random()*cells)};
 }while(snake.some(s=>s.x===p.x&&s.y===p.y));
 return p;
}

function startGame(){
 clearInterval(timer);
 snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
 dx=1;dy=0;score=0;running=true;
 food=randomFood();
 document.getElementById("score").textContent=score;
 document.getElementById("message").textContent="";
 draw();
 timer=setInterval(update,115);
}

function change(x,y){
 if(!running||(x===-dx&&y===-dy))return;
 dx=x;dy=y;
}

function update(){
 let head={x:snake[0].x+dx,y:snake[0].y+dy};
 let eating=head.x===food.x&&head.y===food.y;
 if(head.x<0||head.y<0||head.x>=cells||head.y>=cells||
 snake.slice(0,eating?undefined:-1).some(s=>s.x===head.x&&s.y===head.y)){
  running=false;clearInterval(timer);
  document.getElementById("message").textContent="💥 Game Over! Restart to play again.";
  return;
 }
 snake.unshift(head);
 if(eating){
  score+=10;
  document.getElementById("score").textContent=score;
  food=randomFood();
 }else snake.pop();
 draw();
}

function draw(){
 ctx.fillStyle="#080d1c";
 ctx.fillRect(0,0,360,360);
 ctx.strokeStyle="#182642";
 for(let i=0;i<=360;i+=size){
  ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,360);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(360,i);ctx.stroke();
 }
 ctx.fillStyle="#ff477e";ctx.shadowColor="#ff477e";ctx.shadowBlur=18;
 ctx.beginPath();ctx.arc(food.x*size+9,food.y*size+9,7,0,Math.PI*2);ctx.fill();
 snake.forEach((s,i)=>{
  ctx.fillStyle=i===0?"#55f7d4":"#16c9a5";
  ctx.shadowColor="#55f7d4";ctx.shadowBlur=12;
  ctx.fillRect(s.x*size+2,s.y*size+2,size-4,size-4);
 });
 ctx.shadowBlur=0;
}

document.addEventListener("keydown",e=>{
 const keys={
  ArrowUp:[0,-1],w:[0,-1],
  ArrowDown:[0,1],s:[0,1],
  ArrowLeft:[-1,0],a:[-1,0],
  ArrowRight:[1,0],d:[1,0]
 };
 if(keys[e.key]){e.preventDefault();change(...keys[e.key]);}
});
startGame();
</script>
</body>
</html>
