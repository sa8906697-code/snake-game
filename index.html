<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Snake Pro</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;align-items:center;
 justify-content:center;padding:15px;color:white;font-family:Arial;
 background:linear-gradient(135deg,#090b24,#18234b,#30104b);
}
.game{
 width:100%;max-width:420px;text-align:center;padding:20px;
 background:#11152ddd;border:1px solid #654bff;border-radius:24px;
 box-shadow:0 0 35px #684aff66;
}
h1{color:#55f7d4;text-shadow:0 0 15px #55f7d4}
.stats{display:flex;justify-content:space-around;gap:5px;margin:15px 0}
.stat{background:#222b49;padding:10px;border-radius:12px;flex:1}
.stat span{display:block;color:#ffdc69;font-size:20px;margin-top:5px}
canvas{width:100%;max-width:360px;border:2px solid #55f7d4;
 border-radius:12px;background:#080d1c}
button{
 border:0;border-radius:12px;padding:12px 18px;margin:5px;
 background:linear-gradient(90deg,#00d9b5,#655cff);
 color:white;font-size:17px;font-weight:bold;cursor:pointer;
}
.controls{display:grid;grid-template-columns:repeat(3,60px);
 justify-content:center;gap:5px;margin-top:12px}
.controls button{margin:0}
.hint{color:#b9c5e8;font-size:13px}
#message{color:#ffdc69;font-weight:bold}
</style>
</head>

<body>
<div class="game">
<h1>🐍 NEON SNAKE PRO</h1>

<div class="stats">
 <div class="stat">Score<span id="score">0</span></div>
 <div class="stat">Best 🏆<span id="best">0</span></div>
 <div class="stat">Level<span id="level">1</span></div>
</div>

<canvas id="board" width="360" height="360"></canvas>

<p>
 <button onclick="startGame()">▶ Restart</button>
 <button onclick="toggleSound()" id="soundBtn">🔊 Sound ON</button>
</p>

<div class="controls">
 <span></span><button onclick="change(0,-1)">⬆️</button><span></span>
 <button onclick="change(-1,0)">⬅️</button>
 <button onclick="change(0,1)">⬇️</button>
 <button onclick="change(1,0)">➡️</button>
</div>

<p class="hint">Arrow keys or WASD to play</p>
<p id="message">Let's play! 🎮</p>
</div>

<script>
const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");
const size=18,cells=20;

let snake,food,dx,dy,score,level,timer,running;
let soundOn=true;
let best=Number(localStorage.getItem("snakeBest")||0);
let audio;

const themes=[
 ["#55f7d4","#16c9a5","#ff477e"],
 ["#ffcf5c","#ff8c42","#ff477e"],
 ["#c77dff","#8b5cf6","#55f7d4"],
 ["#ff78c8","#ff477e","#ffcf5c"],
 ["#70e1ff","#38bdf8","#c77dff"]
];

document.getElementById("best").textContent=best;

function beep(freq,duration=0.1){
 if(!soundOn)return;
 try{
  audio=audio||new(window.AudioContext||window.webkitAudioContext)();
  if(audio.state==="suspended")audio.resume();
  const osc=audio.createOscillator();
  const gain=audio.createGain();
  osc.connect(gain);
  gain.connect(audio.destination);
  osc.frequency.value=freq;
  gain.gain.value=0.08;
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.001,audio.currentTime+duration);
  osc.stop(audio.currentTime+duration);
 }catch(e){}
}

function toggleSound(){
 soundOn=!soundOn;
 document.getElementById("soundBtn").textContent=
 soundOn?"🔊 Sound ON":"🔇 Sound OFF";
}

function randomFood(){
 let p;
 do{
  p={x:Math.floor(Math.random()*cells),y:Math.floor(Math.random()*cells)};
 }while(snake.some(s=>s.x===p.x&&s.y===p.y));
 return p;
}

function startGame(){
 clearInterval(timer);
 snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
 dx=1;dy=0;score=0;level=1;running=true;
 food=randomFood();
 updateStats();
 document.getElementById("message").textContent="Let's play! 🎮";
 draw();
 timer=setInterval(update,150);
}

function change(x,y){
 if(!running||(x===-dx&&y===-dy))return;
 dx=x;dy=y;
}

function updateStats(){
 document.getElementById("score").textContent=score;
 document.getElementById("best").textContent=best;
 document.getElementById("level").textContent=level;
}

function update(){
 const head={x:snake[0].x+dx,y:snake[0].y+dy};
 const eating=head.x===food.x&&head.y===food.y;

 if(head.x<0||head.y<0||head.x>=cells||head.y>=cells||
 snake.slice(0,eating?undefined:-1).some(
 s=>s.x===head.x&&s.y===head.y
 )){
  running=false;
  clearInterval(timer);
  beep(150,0.35);
  document.getElementById("message").textContent=
  "💥 Game Over! Restart to play again.";
  return;
 }

 snake.unshift(head);

 if(eating){
  score+=10;
  beep(650);
  food=randomFood();

  if(score>best){
   best=score;
   localStorage.setItem("snakeBest",best);
  }

  const newLevel=Math.floor(score/50)+1;
  if(newLevel!==level){
   level=newLevel;
   clearInterval(timer);
   timer=setInterval(update,Math.max(65,150-(level-1)*12));
   document.getElementById("message").textContent=
   "🌟 Level "+level+" unlocked!";
   beep(900,0.2);
  }
 }else{
  snake.pop();
 }

 updateStats();
 draw();
}

function draw(){
 const theme=themes[(level-1)%themes.length];
 ctx.fillStyle="#080d1c";
 ctx.fillRect(0,0,360,360);

 ctx.strokeStyle="#182642";
 for(let i=0;i<=360;i+=size){
  ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,360);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(360,i);ctx.stroke();
 }

 ctx.fillStyle=theme[2];
 ctx.shadowColor=theme[2];
 ctx.shadowBlur=18;
 ctx.beginPath();
 ctx.arc(food.x*size+9,food.y*size+9,7,0,Math.PI*2);
 ctx.fill();

 snake.forEach((s,i)=>{
  ctx.fillStyle=i===0?theme[0]:theme[1];
  ctx.shadowColor=theme[0];
  ctx.shadowBlur=12;
  ctx.fillRect(s.x*size+2,s.y*size+2,size-4,size-4);
 });

 ctx.shadowBlur=0;
}

document.addEventListener("keydown",e=>{
 const keys={
 ArrowUp:[0,-1],w:[0,-1],W:[0,-1],
 ArrowDown:[0,1],s:[0,1],S:[0,1],
 ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],
 ArrowRight:[1,0],d:[1,0],D:[1,0]
 };
 if(keys[e.key]){
  e.preventDefault();
  change(...keys[e.key]);
 }
});

startGame();
</script>
</body>
</html>
